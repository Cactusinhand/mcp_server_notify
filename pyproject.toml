[project]
name = "mcp-server-notify"
version = "0.2.0"
description = "MCP Server for system notifications with sound"
requires-python = ">=3.10"
dependencies = [
    # <2: the 2.x SDK dropped the low-level Server.list_tools decorator this
    # server is built on — installing unpinned crashes at startup.
    "mcp[cli]>=1.0.0,<2",
    "pydantic>=2.0",
    "plyer>=2.0",
    # Without pywin32 Apprise reports "windows:// is disabled" and only the
    # plyer fallback delivers the toast.
    "pywin32>=306; platform_system == 'Windows'",
    "pygame>=2.1; platform_system != 'Windows' and platform_system != 'Darwin'",
    "apprise>=1.9.2",
    "kokoro-onnx>=0.5.0",
    "sounddevice>=0.5",
]

[project.scripts]
mcp-server-notify = "mcp_server_notify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.0",
    "anyio>=4.0"  # 用于异步测试支持
]

[tool.pytest.ini_options]
markers = [
    "asyncio: mark test as async",
    "parametrize: mark test with parameters",
    "slow: mark test as slow"
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_notify"]

[tool.hatch.build.targets.wheel.force-include]
"src/mcp_server_notify/assets" = "mcp_server_notify/assets"
